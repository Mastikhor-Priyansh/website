<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Follows Maah</title>

    <!-- Security-related browser policies -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   img-src 'self' data:;
                   style-src 'self' 'unsafe-inline';
                   script-src 'self';
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';
                   frame-ancestors 'none';">

    <meta http-equiv="X-Content-Type-Options"
          content="nosniff">

    <meta name="referrer"
          content="strict-origin-when-cross-origin">

    <meta http-equiv="Permissions-Policy"
          content="camera=(),
                   microphone=(),
                   geolocation=(),
                   payment=(),
                   usb=()">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #ffffff;
        }

        h1 {
            margin-top: 30px;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <h1>Money follows maah brothaaa</h1>

    <img
        src="ravikishan.jpg"
        width="1000"
        height="1000"
        alt="Money follows maah brothaaa"
        loading="lazy"
        decoding="async"
    >

    <script>
        "use strict";

        /*
         * Basic anti-clickjacking fallback.
         * The real protection should ideally be provided
         * by the server's frame-ancestors/X-Frame-Options header.
         */
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }

        /*
         * Block javascript: links if any are accidentally
         * added later.
         */
        document.addEventListener("click", function (event) {
            const link = event.target.closest("a");

            if (!link) return;

            const href = link.getAttribute("href");

            if (
                href &&
                href.trim().toLowerCase().startsWith("javascript:")
            ) {
                event.preventDefault();
                console.warn("Unsafe link blocked.");
            }
        });
    </script>

</body>
</html>

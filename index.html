<!DOCTYPE html>
<html>
<head>
    <title>QR Code Image</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <h1>Scan QR Code</h1>

    <div id="qrcode"></div>

    <br>

    <img src="1000204365.jpg"
         width="500"
         height="650"
         alt="Gorilla Image">

    <script>
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 250,
            height: 250
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Follows Maah</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin: 25px 10px;
            font-size: clamp(25px, 5vw, 45px);

            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        .image-container {
            width: 100%;
            padding: 10px 20px 40px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ravi-image {
            /* FULL IMAGE — NO CROPPING */
            width: 100%;
            max-width: 1000px;
            height: auto;

            display: block;

            border-radius: 25px;

            /* Animation */
            animation:
                entrance 1.3s ease-out,
                pulse 2.5s ease-in-out 1.3s infinite,
                glow 2s ease-in-out infinite alternate;

            transition: transform 0.4s ease;
        }

        /* Entrance */
        @keyframes entrance {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(-8deg);
            }

            70% {
                opacity: 1;
                transform: scale(1.04) rotate(2deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Continuous animation */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.035);
            }
        }

        /* Glow */
        @keyframes glow {
            from {
                box-shadow:
                    0 0 10px gold;
            }

            to {
                box-shadow:
                    0 0 25px gold,
                    0 0 55px orange;
            }
        }

        /* Hover */
        .ravi-image:hover {
            transform: scale(1.06) rotate(2deg);
        }

        /* Title animation */
        @keyframes titleGlow {
            from {
                text-shadow: 0 0 5px white;
            }

            to {
                text-shadow:
                    0 0 15px gold,
                    0 0 30px orange;
            }
        }
    </style>
</head>

<body>

    <h1>Money follows maah brothaaa 💰</h1>

    <div class="image-container">
        <img
            class="ravi-image"
            src="ravikishan.jpg"
            alt="Money follows maah brothaaa"
        >
    </div>

</body>
</html>

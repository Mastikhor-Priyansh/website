<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>The Journey</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #050505;
    color: #f5f5f2;
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow: hidden;
}


/* =========================================================
   GLOBAL
========================================================= */

button {
    font-family: inherit;
}

button:focus-visible {
    outline: 1px solid rgba(255,255,255,.65);
    outline-offset: 5px;
}


/* =========================================================
   PAGE 1
========================================================= */

#pageOne {
    position: fixed;
    inset: 0;
    z-index: 10;

    width: 100%;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.055),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.025),
            transparent 30%
        ),
        #050505;

    transition:
        opacity .9s cubic-bezier(.16,1,.3,1),
        transform .9s cubic-bezier(.16,1,.3,1);
}

#pageOne.hide {
    opacity: 0;
    transform: scale(1.04);
    pointer-events: none;
}


/* =========================================================
   BACKGROUND GRAIN
========================================================= */

.noise {
    position: absolute;
    inset: 0;

    opacity: .035;

    pointer-events: none;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

.ambient {
    position: absolute;

    border-radius: 50%;

    pointer-events: none;

    filter: blur(100px);

    opacity: .09;

    will-change: transform;
}

.ambient.one {
    width: 430px;
    height: 430px;

    top: -220px;
    left: -180px;

    background: #fff;

    animation:
        ambientOne 14s ease-in-out infinite alternate;
}

.ambient.two {
    width: 380px;
    height: 380px;

    right: -180px;
    bottom: -200px;

    background: #aaa;

    animation:
        ambientTwo 17s ease-in-out infinite alternate;
}

@keyframes ambientOne {

    from {
        transform: translate3d(0,0,0);
    }

    to {
        transform: translate3d(70px,45px,0);
    }

}

@keyframes ambientTwo {

    from {
        transform: translate3d(0,0,0);
    }

    to {
        transform: translate3d(-60px,-40px,0);
    }

}


/* =========================================================
   PARTICLES
========================================================= */

#particles {
    position: absolute;
    inset: 0;

    overflow: hidden;

    pointer-events: none;
}

.particle {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: rgba(255,255,255,.4);

    animation:
        particleMove linear infinite;

    will-change: transform, opacity;
}

@keyframes particleMove {

    0% {
        transform: translate3d(0,35px,0);
        opacity: 0;
    }

    20% {
        opacity: .5;
    }

    80% {
        opacity: .25;
    }

    100% {
        transform: translate3d(0,-120px,0);
        opacity: 0;
    }

}


/* =========================================================
   PROGRESS BAR
========================================================= */

.progress {
    position: absolute;

    top: 28px;
    left: 50%;

    width: min(330px,55vw);
    height: 1px;

    transform: translateX(-50%);

    background: rgba(255,255,255,.12);
}

.progress span {
    display: block;

    width: 12.5%;
    height: 100%;

    background: rgba(255,255,255,.9);

    transition:
        width .8s cubic-bezier(.16,1,.3,1);
}


/* =========================================================
   STORY CONTAINER
========================================================= */

.story-container {
    position: relative;

    width: min(1100px, calc(100% - 40px));

    text-align: center;
}

.story-counter {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 13px;

    margin-bottom: 35px;

    color: rgba(255,255,255,.38);

    font-size: 10px;
    font-weight: 700;

    letter-spacing: .25em;
}

.counter-line {
    width: 42px;
    height: 1px;

    background: rgba(255,255,255,.18);
}


/* =========================================================
   STORY CONTENT
========================================================= */

.story-content {
    min-height: 330px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;
}

.story-label {
    margin-bottom: 25px;

    color: rgba(255,255,255,.42);

    font-size: 10px;
    font-weight: 700;

    letter-spacing: .34em;
}

#storyText {
    max-width: 1000px;

    font-size:
        clamp(43px, 7vw, 94px);

    line-height: .98;

    font-weight: 700;

    letter-spacing: -.06em;

    text-wrap: balance;
}

#storySubtext {
    max-width: 650px;

    margin-top: 28px;

    color: #8d8d89;

    font-size:
        clamp(14px,1.5vw,19px);

    line-height: 1.7;

    text-wrap: balance;
}


/* =========================================================
   STORY ANIMATIONS
========================================================= */

.story-enter {
    animation:
        storyEnter .8s cubic-bezier(.16,1,.3,1) both;
}

.story-exit {
    animation:
        storyExit .42s cubic-bezier(.4,0,1,1) both;
}

@keyframes storyEnter {

    from {
        opacity: 0;

        transform:
            translate3d(0,35px,0)
            scale(.97);

        filter: blur(9px);
    }

    to {
        opacity: 1;

        transform:
            translate3d(0,0,0)
            scale(1);

        filter: blur(0);
    }

}

@keyframes storyExit {

    from {
        opacity: 1;

        transform:
            translate3d(0,0,0);

        filter: blur(0);
    }

    to {
        opacity: 0;

        transform:
            translate3d(0,-25px,0);

        filter: blur(8px);
    }

}


/* =========================================================
   NEXT BUTTON
========================================================= */

#nextButton {
    margin-top: 28px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 15px;

    min-width: 145px;
    height: 50px;

    padding: 0 22px;

    border:
        1px solid rgba(255,255,255,.16);

    border-radius: 999px;

    background:
        rgba(255,255,255,.035);

    color: white;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: .22em;

    cursor: pointer;

    transition:
        transform .35s cubic-bezier(.16,1,.3,1),
        background .35s ease,
        border-color .35s ease;
}

#nextButton:hover {

    transform:
        translateY(-4px)
        scale(1.025);

    background:
        rgba(255,255,255,.08);

    border-color:
        rgba(255,255,255,.35);
}

#nextButton:active {

    transform:
        scale(.95);
}

.next-arrow {

    font-size: 17px;

    transition:
        transform .35s ease;
}

#nextButton:hover .next-arrow {

    transform:
        translateX(4px);
}


/* =========================================================
   PAGE 2
========================================================= */

#pageTwo {
    position: fixed;
    inset: 0;

    z-index: 5;

    width: 100%;
    height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    opacity: 0;

    transform:
        scale(1.06);

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(255,255,255,.07),
            transparent 30%
        ),
        #030303;

    transition:
        opacity 1s cubic-bezier(.16,1,.3,1),
        transform 1.1s cubic-bezier(.16,1,.3,1);
}

#pageTwo.active {

    opacity: 1;

    transform:
        scale(1);

    pointer-events: auto;
}


/* =========================================================
   PAGE 2 LIGHT
========================================================= */

.page-two-light {
    position: absolute;

    width: 650px;
    height: 650px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.1),
            transparent 65%
        );

    filter: blur(25px);

    animation:
        slowPulse 5s ease-in-out infinite alternate;
}

@keyframes slowPulse {

    from {
        transform: scale(.85);
        opacity: .55;
    }

    to {
        transform: scale(1.1);
        opacity: 1;
    }

}


/* =========================================================
   PAGE 2 CONTENT
========================================================= */

.page-two-content {

    position: relative;
    z-index: 2;

    text-align: center;

    opacity: 0;

    transform:
        translateY(30px);

    transition:
        opacity .9s ease .35s,
        transform .9s cubic-bezier(.16,1,.3,1) .35s;
}

#pageTwo.active .page-two-content {

    opacity: 1;

    transform:
        translateY(0);
}

.page-two-label {

    margin-bottom: 20px;

    color:
        rgba(255,255,255,.4);

    font-size: 10px;
    font-weight: 800;

    letter-spacing: .35em;
}

.page-two-content h2 {

    font-size:
        clamp(48px,8vw,105px);

    line-height: .92;

    letter-spacing: -.065em;

    margin-bottom: 20px;
}

.page-two-content h2 span {

    color:
        rgba(255,255,255,.38);
}

.page-two-content p {

    color:
        rgba(255,255,255,.45);

    font-size: 14px;

    letter-spacing: .03em;
}


/* =========================================================
   REVEAL STATUS
========================================================= */

.reveal-status {

    margin-top: 35px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    color:
        rgba(255,255,255,.35);

    font-size: 9px;
    font-weight: 700;

    letter-spacing: .2em;
}

.status-dot {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 15px rgba(255,255,255,.8);

    animation:
        statusPulse 1.4s ease-in-out infinite;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: .3;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }

}


/* =========================================================
   IMAGE POPUP
========================================================= */

#imagePopup {

    position: fixed;
    inset: 0;

    z-index: 50000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .6s ease,
        visibility 0s linear .6s;
}

#imagePopup.active {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transition:
        opacity .6s ease;
}


/* =========================================================
   POPUP BACKDROP
========================================================= */

.popup-backdrop {

    position: absolute;
    inset: 0;

    background:
        rgba(0,0,0,.88);

    backdrop-filter:
        blur(22px);

    -webkit-backdrop-filter:
        blur(22px);
}


/* =========================================================
   POPUP GLOW
========================================================= */

.popup-glow {

    position: absolute;

    width:
        min(80vw,750px);

    height:
        min(80vw,750px);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.13),
            transparent 68%
        );

    filter:
        blur(45px);

    opacity: 0;

    transform:
        scale(.7);

    transition:
        opacity .9s ease,
        transform 1s cubic-bezier(.16,1,.3,1);
}

#imagePopup.active .popup-glow {

    opacity: 1;

    transform:
        scale(1);
}


/* =========================================================
   POPUP CARD
========================================================= */

.popup-card {

    position: relative;
    z-index: 2;

    display: flex;

    flex-direction: column;

    align-items: center;

    max-width:
        min(680px,94vw);

    opacity: 0;

    transform:
        translate3d(0,50px,0)
        scale(.72)
        rotateX(8deg);

    filter:
        blur(16px);

    transition:
        opacity .55s ease,
        transform .9s cubic-bezier(.16,1,.3,1),
        filter .9s ease;
}

#imagePopup.active .popup-card {

    opacity: 1;

    transform:
        translate3d(0,0,0)
        scale(1)
        rotateX(0);

    filter:
        blur(0);
}


/* =========================================================
   CLOSE BUTTON
========================================================= */

#closePopup {

    position: absolute;

    top: -18px;
    right: -18px;

    z-index: 10;

    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border:
        1px solid rgba(255,255,255,.2);

    border-radius: 50%;

    background:
        rgba(15,15,15,.95);

    color: white;

    font-size: 25px;
    font-weight: 300;

    cursor: pointer;

    transition:
        transform .3s ease,
        background .3s ease;
}

#closePopup:hover {

    transform:
        rotate(90deg)
        scale(1.08);

    background:
        rgba(255,255,255,.12);
}


/* =========================================================
   VERIFIED LABEL
========================================================= */

.verified-label {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 15px;

    color:
        rgba(255,255,255,.55);

    font-size: 9px;
    font-weight: 800;

    letter-spacing: .28em;
}

.verified-label span {

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 16px rgba(255,255,255,.9);
}


/* =========================================================
   IMAGE FRAME
========================================================= */

.image-frame {

    position: relative;

    max-width: 100%;
}

.image-frame::before {

    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 20px;

    border:
        1px solid rgba(255,255,255,.14);

    pointer-events: none;

    z-index: 3;
}

.image-frame::after {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 20px;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            transparent 25%,
            transparent 75%,
            rgba(255,255,255,.03)
        );

    z-index: 2;
}

#popupImage {

    display: block;

    width: auto;
    height: auto;

    max-width:
        min(620px,88vw);

    max-height:
        70vh;

    object-fit: contain;

    border-radius: 20px;

    box-shadow:
        0 40px 120px rgba(0,0,0,.8),
        0 0 60px rgba(255,255,255,.04);

    user-select: none;

    animation:
        imageFloat 6s ease-in-out infinite;
}

@keyframes imageFloat {

    0%,
    100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-6px);
    }

}


/* =========================================================
   POPUP CAPTION
========================================================= */

.popup-caption {

    margin-top: 20px;

    text-align: center;
}

.popup-title {

    color: white;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: .28em;
}

.popup-subtitle {

    margin-top: 8px;

    color:
        rgba(255,255,255,.4);

    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .story-container {
        width:
            calc(100% - 28px);
    }

    .story-content {
        min-height: 290px;
    }

    #storyText {
        font-size:
            clamp(39px,12vw,58px);
    }

    #storySubtext {
        max-width: 340px;
        font-size: 14px;
    }

    .story-label {
        font-size: 9px;
    }

    .page-two-content h2 {
        font-size: 51px;
    }

    #popupImage {
        max-width: 88vw;
        max-height: 66vh;
        border-radius: 15px;
    }

    #closePopup {
        top: -12px;
        right: -4px;
    }

    .popup-card {
        max-width: 94vw;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }

}

</style>
</head>


<body>


<!-- =======================================================
     PAGE 1 — MOTIVATIONAL STORY
======================================================= -->

<section id="pageOne">

    <div class="noise"></div>

    <div class="ambient one"></div>
    <div class="ambient two"></div>

    <div id="particles"></div>


    <!-- Progress -->
    <div class="progress">
        <span id="progressBar"></span>
    </div>


    <main class="story-container">


        <!-- Counter -->
        <div class="story-counter">

            <span id="storyNumber">
                01
            </span>

            <span class="counter-line"></span>

            <span>
                08
            </span>

        </div>


        <!-- Story -->
        <div
            id="storyContent"
            class="story-content story-enter"
        >

            <div
                id="storyLabel"
                class="story-label"
            >
                THE BEGINNING
            </div>


            <h1 id="storyText">
                Everyone sees the destination.
            </h1>


            <p id="storySubtext">
                Almost nobody sees the nights that built it.
            </p>

        </div>


        <!-- NEXT -->
        <button
            id="nextButton"
            type="button"
        >

            <span>
                NEXT
            </span>

            <span class="next-arrow">
                →
            </span>

        </button>

    </main>

</section>



<!-- =======================================================
     PAGE 2 — CINEMATIC REVEAL
======================================================= -->

<section id="pageTwo">


    <div class="noise"></div>

    <div class="page-two-light"></div>


    <div class="page-two-content">

        <div class="page-two-label">
            THE REVEAL
        </div>


        <h2>
            You kept<br>
            <span>going.</span>
        </h2>


        <p>
            And that's what makes the difference.
        </p>


        <div class="reveal-status">

            <span class="status-dot"></span>

            REVEALING SOMETHING SPECIAL

        </div>

    </div>

</section>



<!-- =======================================================
     IMAGE POPUP
======================================================= -->

<div
    id="imagePopup"
    aria-hidden="true"
>


    <div class="popup-backdrop"></div>


    <div class="popup-glow"></div>


    <div
        class="popup-card"
        role="dialog"
        aria-modal="true"
        aria-label="Special reveal"
    >


        <!-- Close -->
        <button
            id="closePopup"
            type="button"
            aria-label="Close"
        >
            ×
        </button>


        <!-- Verified -->
        <div class="verified-label">

            <span></span>

            SPECIAL REVEAL

        </div>


        <!-- Image -->
        <div class="image-frame">

            <!--
                IMPORTANT:
                Keep ravikishan.jpg in the same folder
                as this HTML file.
            -->

            <img
                id="popupImage"
                src="ravikishan.jpg"
                alt="Special reveal"
            >

        </div>


        <!-- Caption -->
        <div class="popup-caption">

            <div class="popup-title">
                THE MOMENT
            </div>

            <div class="popup-subtitle">
                Some things are worth revealing.
            </div>

        </div>

    </div>

</div>



<script>

/* =========================================================
   CINEMATIC STORY SYSTEM
========================================================= */

(() => {

    "use strict";


    /* =====================================================
       STORY DATA
    ===================================================== */

    const stories = [

        {
            label: "THE BEGINNING",

            title:
                "Everyone sees the destination.",

            sub:
                "Almost nobody sees the nights that built it."
        },

        {
            label: "THE START",

            title:
                "You begin with almost nothing.",

            sub:
                "No applause. No shortcuts. Just the courage to start."
        },

        {
            label: "THE DOUBT",

            title:
                "Then people start questioning you.",

            sub:
                "They doubt your idea. Then they doubt you."
        },

        {
            label: "THE FALL",

            title:
                "You will fail.",

            sub:
                "Sometimes harder than you ever expected."
        },

        {
            label: "THE CHOICE",

            title:
                "But falling is not the ending.",

            sub:
                "The real story begins when you decide to stand again."
        },

        {
            label: "THE DISCIPLINE",

            title:
                "You keep moving without motivation.",

            sub:
                "Because discipline carries you when motivation disappears."
        },

        {
            label: "THE RESULT",

            title:
                "One day, the impossible looks obvious.",

            sub:
                "Not because life became easier. Because you became stronger."
        },

        {
            label: "THE FUTURE",

            title:
                "Build quietly. Let the result speak.",

            sub:
                "Your future self is counting on what you do today."
        }

    ];


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const pageOne =
        document.getElementById("pageOne");

    const pageTwo =
        document.getElementById("pageTwo");

    const storyContent =
        document.getElementById("storyContent");

    const storyNumber =
        document.getElementById("storyNumber");

    const storyLabel =
        document.getElementById("storyLabel");

    const storyText =
        document.getElementById("storyText");

    const storySubtext =
        document.getElementById("storySubtext");

    const progressBar =
        document.getElementById("progressBar");

    const nextButton =
        document.getElementById("nextButton");

    const particles =
        document.getElementById("particles");

    const imagePopup =
        document.getElementById("imagePopup");

    const closePopup =
        document.getElementById("closePopup");

    const popupBackdrop =
        document.querySelector(".popup-backdrop");


    /* =====================================================
       STATE
    ===================================================== */

    let currentStory = 0;

    let animating = false;

    let movedToPageTwo = false;


    /* =====================================================
       PARTICLES
    ===================================================== */

    const particleCount =
        window.innerWidth < 600 ? 12 : 22;

    const fragment =
        document.createDocumentFragment();


    for (
        let i = 0;
        i < particleCount;
        i++
    ) {

        const particle =
            document.createElement("span");

        particle.className =
            "particle";

        particle.style.left =
            Math.random() * 100 + "%";

        particle.style.top =
            Math.random() * 100 + "%";

        particle.style.animationDuration =
            7 + Math.random() * 9 + "s";

        particle.style.animationDelay =
            Math.random() * -10 + "s";

        fragment.appendChild(
            particle
        );

    }

    particles.appendChild(fragment);


    /* =====================================================
       UPDATE STORY
    ===================================================== */

    function updateStory(index) {

        const story =
            stories[index];


        storyContent.classList.remove(
            "story-enter"
        );

        storyContent.classList.add(
            "story-exit"
        );


        setTimeout(() => {

            storyNumber.textContent =
                String(index + 1)
                    .padStart(2, "0");


            storyLabel.textContent =
                story.label;


            storyText.textContent =
                story.title;


            storySubtext.textContent =
                story.sub;


            progressBar.style.width =
                ((index + 1) /
                    stories.length * 100)
                + "%";


            storyContent.classList.remove(
                "story-exit"
            );


            void storyContent.offsetWidth;


            storyContent.classList.add(
                "story-enter"
            );


            animating = false;

        }, 430);

    }


    /* =====================================================
       NEXT BUTTON
    ===================================================== */

    nextButton.addEventListener(
        "click",
        () => {

            if (animating) {
                return;
            }


            if (
                currentStory <
                stories.length - 1
            ) {

                animating = true;

                currentStory++;

                updateStory(
                    currentStory
                );

                return;
            }


            /*
                Final NEXT:
                Move to completely new page.
            */

            goToPageTwo();

        }
    );


    /* =====================================================
       PAGE 2 TRANSITION
    ===================================================== */

    function goToPageTwo() {

        if (movedToPageTwo) {
            return;
        }

        movedToPageTwo = true;


        /*
            Fade/scale Page 1 away.
        */

        pageOne.classList.add(
            "hide"
        );


        /*
            Activate Page 2.
        */

        setTimeout(() => {

            pageTwo.classList.add(
                "active"
            );

        }, 180);


        /*
            After the cinematic transition,
            automatically reveal the image.
        */

        setTimeout(() => {

            openImagePopup();

        }, 1050);

    }


    /* =====================================================
       OPEN IMAGE POPUP
    ===================================================== */

    function openImagePopup() {

        imagePopup.classList.add(
            "active"
        );

        imagePopup.setAttribute(
            "aria-hidden",
            "false"
        );


        document.body.style.overflow =
            "hidden";


        setTimeout(() => {

            closePopup.focus();

        }, 650);

    }


    /* =====================================================
       CLOSE IMAGE POPUP
    ===================================================== */

    function closeImagePopup() {

        imagePopup.classList.remove(
            "active"
        );

        imagePopup.setAttribute(
            "aria-hidden",
            "true"
        );


        document.body.style.overflow =
            "";

    }


    closePopup.addEventListener(
        "click",
        closeImagePopup
    );


    popupBackdrop.addEventListener(
        "click",
        closeImagePopup
    );


    /* =====================================================
       ESC KEY
    ===================================================== */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Escape" &&
                imagePopup.classList.contains(
                    "active"
                )
            ) {

                closeImagePopup();

            }

        }
    );


    /* =====================================================
       INITIAL PROGRESS
    ===================================================== */

    progressBar.style.width =
        (1 / stories.length * 100)
        + "%";


})();

</script>

</body>
</html>

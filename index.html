<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Follows Maah</title>

    <!-- Basic security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   img-src 'self' data:;
                   style-src 'self' 'unsafe-inline';
                   script-src 'self';
                   object-src 'none';
                   base-uri 'self';
                   form-action 'self';
                   frame-ancestors 'none';">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            margin: 30px 10px 20px;
            font-size: clamp(25px, 5vw, 50px);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        /* Ravi Kishan image */
        .ravi-image {
            display: block;
            width: 1000px;
            height: 1000px;
            max-width: 90%;
            object-fit: cover;

            margin: 30px auto;

            border-radius: 25px;

            animation:
                floatRavi 3s ease-in-out infinite,
                glowRavi 2s ease-in-out infinite alternate;

            transition: transform 0.4s ease;
        }

        /* Floating animation */
        @keyframes floatRavi {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-18px) rotate(1deg);
            }
        }

        /* Golden glow */
        @keyframes glowRavi {
            from {
                box-shadow:
                    0 0 10px rgba(255, 215, 0, 0.3);
            }

            to {
                box-shadow:
                    0 0 25px rgba(255, 215, 0, 0.9),
                    0 0 60px rgba(255, 165, 0, 0.5);
            }
        }

        /* Title glow */
        @keyframes titleGlow {
            from {
                text-shadow: 0 0 5px #fff;
            }

            to {
                text-shadow:
                    0 0 15px gold,
                    0 0 30px orange;
            }
        }

        /* Hover effect */
        .ravi-image:hover {
            transform: scale(1.04) rotate(-2deg);
            cursor: pointer;
        }

        /* Floating money emojis */
        .money {
            position: fixed;
            font-size: 35px;
            pointer-events: none;
            animation: moneyFall linear infinite;
            opacity: 0.8;
        }

        .money:nth-child(1) {
            left: 10%;
            animation-duration: 5s;
            animation-delay: 0s;
        }

        .money:nth-child(2) {
            left: 30%;
            animation-duration: 6s;
            animation-delay: 2s;
        }

        .money:nth-child(3) {
            left: 55%;
            animation-duration: 4s;
            animation-delay: 1s;
        }

        .money:nth-child(4) {
            left: 75%;
            animation-duration: 7s;
            animation-delay: 3s;
        }

        .money:nth-child(5) {
            left: 90%;
            animation-duration: 5s;
            animation-delay: 1s;
        }

        @keyframes moneyFall {
            0% {
                top: -50px;
                transform: rotate(0deg);
            }

            100% {
                top: 110vh;
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>Money follows maah brothaaa 💰</h1>

    <!-- Flying money -->
    <div class="money">💰</div>
    <div class="money">💵</div>
    <div class="money">💰</div>
    <div class="money">💵</div>
    <div class="money">💰</div>

    <!-- Main image -->
    <img
        class="ravi-image"
        src="ravikishan.jpg"
        width="1000"
        height="1000"
        alt="Money follows maah brothaaa"
    >

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Follows Maah</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin-top: 30px;
            font-size: 40px;
        }

        .image-container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .ravi-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 25px;

            /* MAIN ANIMATION */
            animation:
                entrance 1.5s ease-out,
                crazyPulse 2s ease-in-out 1.5s infinite,
                glow 2s ease-in-out infinite alternate;

            transition: transform 0.3s ease;
        }

        /* Image enters dramatically */
        @keyframes entrance {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(-15deg);
            }

            60% {
                opacity: 1;
                transform: scale(1.08) rotate(5deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Continuous funny zoom + shake */
        @keyframes crazyPulse {
            0% {
                transform: scale(1) rotate(0deg);
            }

            25% {
                transform: scale(1.03) rotate(-1deg);
            }

            50% {
                transform: scale(1.06) rotate(1deg);
            }

            75% {
                transform: scale(1.03) rotate(-1deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Glowing border */
        @keyframes glow {
            from {
                box-shadow:
                    0 0 10px gold,
                    0 0 20px orange;
            }

            to {
                box-shadow:
                    0 0 30px gold,
                    0 0 70px orange,
                    0 0 100px gold;
            }
        }

        /* Extra effect on mouse hover */
        .ravi-image:hover {
            transform: scale(1.1) rotate(3deg);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Money follows maah brothaaa 💰</h1>

    <div class="image-container">
        <img
            class="ravi-image"
            src="ravikishan.jpg"
            alt="Money follows maah brothaaa"
        >
    </div>

</body>
</html>
